name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job rather than a step inside `web`, for one reason: lint output is
  # the same on every platform and every Node version, so running it on all
  # four `web` legs would be four copies of one answer. One runner, no matrix.
  #
  # It is a linter and not a formatter, and that line is deliberate. Three plan
  # documents under `docs/superpowers/plans/` record the decision not to run
  # prettier — it rewrites the repo to double quotes against house style — and
  # `cargo fmt --check` is left out of the `rust` job below for exactly the
  # same reason: nothing here has ever been rustfmt'd, so adding that check
  # means a 6,000-line reformat, which is its own change and not a thing to
  # smuggle in beside a lint config. Whitespace stays with review; the rules
  # that are here are the ones review cannot be relied on to hold forever.
  #
  # A required check on `main` as of 2026-08-25, alongside the other ten, so a
  # change that crosses one of the four layering boundaries cannot land. With
  # `enforce_admins` on there is no override, which is the argument for keeping
  # the config's error tier to rules that are about the architecture rather
  # than about taste — and for the two that stay at warning level.
  lint:
    name: lint
    runs-on: ubuntu-22.04
    # Same reasoning as the `rust` job below, which is where the unbounded
    # hang actually happened. 10 against a 30-second run: nothing here should
    # ever approach it, and an unbounded required check is the thing being
    # removed rather than a duration being tuned.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No `--max-warnings 0`. The config keeps two rules at warning level on
      # purpose — `no-useless-assignment` over nine defensive initialisers in
      # `services/`, and `no-floating-promises` over a discard that `app.ts`
      # argues for — and each says why in `eslint.config.js`. Errors block;
      # warnings are there to be read.
      - name: Lint
        run: npm run lint

  web:
    name: web (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # 20 against a 2-3 minute run. Bounded for the `rust` job's reason and with
    # a specific hazard of its own: this suite spawns real child processes and
    # the matrix comment below says Windows is where that class of thing has
    # broken before. A child that never exits would hold this open exactly the
    # way `cargo test` did.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the README promises; 22 is what development uses.
        # Testing both is what keeps that promise from going stale.
        node: [20, 22]
        # Windows is here because the suite spawns real child processes and
        # asserts exact document text, and this is the platform where that
        # class of thing has actually broken before — the `rust` job proves
        # the Rust side compiles on Windows and says nothing about vitest.
        # Both Node versions rather than one: ESM and fs behaviour on Windows
        # is where the versions differ, so pinning it to a single version
        # would test the least interesting half.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      # The production build catches what neither tests nor svelte-check do:
      # a bundler-level break that only shows up on the release path.
      - name: Build
        run: npm run build

      # Stories compile through the svelte-csf plugin, which nothing else in
      # this pipeline runs, so a story can break in a way the rest of CI calls
      # clean: duplicating a story name reports 0 errors from `npm run check`
      # and fails this step with DuplicateStoryIdentifiersError. Storybook is
      # where a component's states get looked at, and a preview that will not
      # build is one nobody looks at until they next need it.
      #
      # One leg because compiling stories is the same work on every platform
      # and both Node versions, and it is the whole job on the matrix that has
      # no reason to differ. Measured at 4s locally for the seven story files.
      - name: Build Storybook
        if: matrix.os == 'ubuntu-22.04' && matrix.node == 22
        run: npm run storybook:build

      # Deliberately without `--with-deps`, which shells out to apt — the same
      # apt the rust job's cache comment documents degrading a 9s fetch into
      # 22 minutes on these runners. The ubuntu-22.04 image ships most of what
      # chromium links against, so the bet is that the bare install is enough.
      # If this step starts failing on a missing shared library, that bet lost
      # and the fix is the runner image, not `--with-deps`.
      - name: Cache Playwright browsers
        if: matrix.os == 'ubuntu-22.04' && matrix.node == 22
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-

      - name: Install Chromium
        if: matrix.os == 'ubuntu-22.04' && matrix.node == 22
        run: npx playwright install chromium

      # Every story rendered in a real browser with axe over it. One leg for
      # the same reason as the Storybook build, and emphatically not part of
      # `npm test`: that suite is node-only on four legs, and giving it a
      # browser dependency would put this download on all of them.
      - name: Test stories
        if: matrix.os == 'ubuntu-22.04' && matrix.node == 22
        run: npm run test:stories

      # The typing path, in the chromium the step above already installed.
      # This is the check behind CONTRIBUTING.md rule 5 - "nothing new on the
      # typing path" - which was enforced by review alone until 2026-08-25.
      # It asserts a keystroke costs the same in a 16,000-line document as in a
      # 2,000-line one, which is what viewport-bounded work looks like and what
      # a document-wide scan is not.
      #
      # It cannot run under jsdom and that is not a preference: jsdom returns
      # zeros from every measurement CodeMirror makes (see
      # tests/support/jsdom-layout.ts), and viewport calculation and layout are
      # most of what a keystroke costs. One leg, for the same reason as the two
      # steps above - the answer does not differ by platform or Node version.
      - name: Test the typing path
        if: matrix.os == 'ubuntu-22.04' && matrix.node == 22
        run: npm run test:editor

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bounded because it was not, and that cost eight hours. On 2026-08-25 the
    # Windows leg of the 0.10.0 release commit passed Clippy and then wedged in
    # `cargo test`, running until it was cancelled by hand the next morning.
    # The job had no timeout, so nothing stopped it: a required check with
    # `enforce_admins` on, held open indefinitely by a hung runner.
    #
    # 45 rather than something tighter, because the honest answer to "how long
    # is a legitimate cold build here?" is that nobody knows. A warm run is
    # 3-4 minutes; the only cold data point is the hang itself. The `e2e` job
    # below budgets 60 for a cold Windows Rust cache *plus* a Tauri bundle, and
    # this builds less than that, so 45 sits above any real build and two
    # orders of magnitude below what actually happened. A false timeout on a
    # required check is the expensive mistake, which is the argument for
    # erring high rather than low.
    #
    # Worth knowing about the release specifically: a version bump rewrites
    # `Cargo.lock`, which changes the `rust-cache` key, so **every release
    # commit gets a cold cache here**. The slow run is expected; the unbounded
    # one was not.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows is here so that `#[cfg(windows)]` is compiled by something
        # other than a release. fs.rs and pty.rs have had Windows branches all
        # along and nothing has ever built them — a release runner alone would
        # have found that out at tag time, which is the worst moment.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # The Azure apt mirror behind these runners intermittently degrades in a
      # way apt cannot detect: every request still succeeds, but each one takes
      # 5-18s to start regardless of size, and ~130 packages fetched serially
      # turn a 40-second step into a 10-26 minute one. Nothing errors, so apt's
      # own retry and timeout options never fire. Measured 2026-08-18: healthy
      # was 55.6 MB in 9s, degraded was the same 55.6 MB in 22min 12s.
      # Caching the .debs is what actually removes the exposure; the retry
      # inside the action bounds the cost of a cold cache on a bad day.
      - name: Cache apt archives
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-jammy-base-${{ hashFiles('.github/actions/linux-build-deps/action.yml') }}
          restore-keys: apt-jammy-base-

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/linux-build-deps
        # A backstop only: the action's own per-attempt timeouts should fire
        # long before this does.
        timeout-minutes: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # First, because it is seconds and it answers a question the other two
      # cannot: does `Cargo.lock` still describe `Cargo.toml`?
      #
      # It did not, between the `wdio` feature being added and 2026-08-29 — the
      # optional `tauri-plugin-wdio-webdriver` was absent from the lock
      # entirely, so every `cargo` invocation quietly rewrote it and no build
      # was reproducible from what was committed. Nothing failed, which is
      # exactly why it went unnoticed for weeks: no step here passed `--locked`,
      # so cargo was always free to fix it in passing and never say so.
      #
      # `metadata` rather than a build: it resolves the whole graph, including
      # every optional dependency and every platform's, and needs no
      # compilation to do it.
      #
      # `shell: bash` because the matrix includes Windows, where the default
      # shell is PowerShell and a Unix null redirect is read as a path that
      # does not exist — which is how this step failed the first time it ran.
      # The redirect itself matters: `cargo metadata` prints the entire
      # resolved graph, and the exit code is the only part worth reading.
      - name: Check the lockfile is current
        working-directory: src-tauri
        shell: bash
        run: cargo metadata --format-version 1 --locked > /dev/null

      # Before `cargo test`, because a lint failure is cheaper to read than a
      # test failure and `--all-targets` compiles the test code anyway, so the
      # cache it warms is the one the next step wants.
      #
      # `-D warnings` covers rustc's own warnings as well as clippy's, which is
      # the half that matters most here: the three-platform matrix means a
      # `#[cfg(windows)]` branch that has gone stale now says so on Windows
      # rather than compiling quietly and failing at release time.
      #
      # Not `--all-features`: the `wdio` feature compiles an entire WebDriver
      # server that only the e2e job wants.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # The first automated check that ever launches the packaged app.
  #
  # Everything above this job tests source. Before this existed the desktop
  # binary had been verified once, by a human, on macOS - and that walk marked
  # 12 of its 17 items UNSEEN and reported two defects that were later traced
  # to the walker's own harness rather than to Nox. Windows and Linux shipped
  # installers nobody had ever launched.
  #
  # All three platforms drive through a WebDriver server compiled *into* the
  # app, behind `src-tauri`'s `wdio` feature. That replaced an external
  # `tauri-driver`, which worked on Linux and is a dead end on Windows - with
  # the exactly matching msedgedriver in place, `POST /session` still waited
  # sixty seconds for a Chromium DevTools port that a Tauri WebView2 window
  # never opens - and which does not exist for macOS at all. One server, three
  # platforms, no external driver anywhere.
  #
  # All three legs are required checks on `main` as of 2026-08-24, so a change
  # that breaks the packaged app on any platform cannot land. Promoted on a
  # measured record rather than a hunch: 36 job runs, zero flaky failures at
  # the time. The one failure in that window was macOS's first run, which
  # caught two real defects in the specs - a true positive.
  #
  # The first flake arrived 2026-08-25 on Windows (PR #136, a renderer-only
  # change): the app spawned and its embedded WebDriver server never answered
  # on port 4445 inside the 60s window, so `onPrepare` failed and no spec ran
  # at all. It passed on re-run. Recorded rather than smoothed over, because
  # the argument for `enforce_admins` on this suite rests on that record and
  # the honest version of it is now "one flake in ~40", not zero. A failure
  # that names `onPrepare` and a port is the harness, not the app - the specs
  # never started - and it is worth checking which of the two you have before
  # reaching for a re-run.
  #
  # `enforce_admins` is on, so a leg that goes flaky blocks everyone with no
  # override. That is the argument for keeping this suite assertion-only and
  # free of geometry, and for adding platforms one record at a time.
  #
  # Eight specs as of 2026-08-25, up from the original four. The additions are
  # walk items the 2026-08-20 manual pass marked UNSEEN (A4, C5, C8) and the
  # in-window menu bar, which production readiness §5 names as the freshest
  # code in the product sitting on its least-verified platforms.
  #
  # One thing this harness cannot do, established here rather than rediscovered:
  # **it cannot deliver a right-click.** `element.click({ button: 'right' })`
  # and the explicit W3C pointer sequence both report success and produce no
  # `contextmenu` event, on WebKitGTK, WebView2 and macOS alike. Context menus
  # are asserted in jsdom instead - see `tests/tab-context-menu.test.ts`.
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 60 rather than 45: a cold Rust cache on Windows is the slowest build in
    # this workflow, and a timeout there would read as a harness failure.
    timeout-minutes: 60
    strategy:
      # All three desktop platforms Nox ships an installer for. No fail-fast:
      # a defect on one platform is exactly what this matrix exists to find,
      # and cancelling the others on the first red hides the comparison that
      # makes such a defect readable.
      #
      # macOS is the one with prior art — the 2026-08-20 hand walk — and it is
      # the least trustworthy of the three, because 12 of its 17 items were
      # never seen and both defects it reported were the walker's own harness.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Its own key rather than the `rust` job's: this installs a different
      # package set, and sharing a key would make the two jobs evict each
      # other's archives on every run.
      - name: Cache apt archives
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-jammy-e2e-${{ hashFiles('.github/actions/linux-build-deps/action.yml') }}
          restore-keys: apt-jammy-e2e-

      # Linux only, and `xvfb` is the whole of it now — a GTK window still has
      # to draw somewhere and a runner has no display. `webkit2gtk-driver` was
      # here for WebKitWebDriver, which the embedded provider replaced; it was
      # kept through that swap and through the focus fix so each had exactly
      # one variable, and both are green, so it goes.
      #
      # Windows and macOS need nothing: the WebDriver server is inside the
      # binary, and both runners have a desktop session to draw into.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps
        with:
          extra-packages: xvfb
        timeout-minutes: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No driver to install. The WebDriver server is compiled into the app by
      # the `wdio` feature below, which is the whole point of the embedded
      # provider: `tauri-driver`, WebKitWebDriver and msedgedriver all stop
      # being part of this.
      - name: Install root dependencies
        run: npm ci

      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci

      # `--debug` because a release build costs several minutes more for a
      # binary that behaves the same under WebDriver, and `--no-bundle`
      # because the installer is not what is being driven - the binary is.
      # `bash` on both platforms: PowerShell is the Windows default and has
      # its own reading of the `--` separator, which is the one token that
      # has to survive intact for the flags to reach `tauri` rather than npm.
      # `--features wdio` is what compiles the embedded WebDriver server in.
      # It is off by default and named nowhere else, so a release build cannot
      # pick it up by accident; `lib.rs` additionally requires
      # `debug_assertions`, which `--debug` satisfies here and a release never
      # would.
      - name: Build the app
        shell: bash
        run: npm run tauri build -- --debug --no-bundle --features wdio

      # One step with the branch visible rather than two `if`-guarded steps
      # that would both be called "Drive it". `bash` is forced because Windows
      # runners default to PowerShell and the difference here is one word.
      - name: Drive it
        working-directory: e2e
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # A GTK window with no display server never draws, and never
            # answers the driver either.
            xvfb-run -a npm test
          else
            npm test
          fi

      # The point of the whole exercise is an artefact to look at afterwards,
      # so keep whatever the run produced even when - especially when - it
      # failed.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per matrix entry: v4 refuses a name another job already uploaded,
          # so a shared one would fail the second platform to finish.
          name: e2e-logs-${{ matrix.os }}
          path: |
            e2e/logs/
            e2e/*.log
          if-no-files-found: ignore
