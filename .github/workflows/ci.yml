name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red main can be re-checked without an empty commit.
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the README promises; 22 is what development uses.
        # Testing both is what keeps that promise from going stale.
        node: [20, 22]
        # Windows is here because the suite spawns real child processes and
        # asserts exact document text, and this is the platform where that
        # class of thing has actually broken before — the `rust` job proves
        # the Rust side compiles on Windows and says nothing about vitest.
        # Both Node versions rather than one: ESM and fs behaviour on Windows
        # is where the versions differ, so pinning it to a single version
        # would test the least interesting half.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      # The production build catches what neither tests nor svelte-check do:
      # a bundler-level break that only shows up on the release path.
      - name: Build
        run: npm run build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is here so that `#[cfg(windows)]` is compiled by something
        # other than a release. fs.rs and pty.rs have had Windows branches all
        # along and nothing has ever built them — a release runner alone would
        # have found that out at tag time, which is the worst moment.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # The Azure apt mirror behind these runners intermittently degrades in a
      # way apt cannot detect: every request still succeeds, but each one takes
      # 5-18s to start regardless of size, and ~130 packages fetched serially
      # turn a 40-second step into a 10-26 minute one. Nothing errors, so apt's
      # own retry and timeout options never fire. Measured 2026-08-18: healthy
      # was 55.6 MB in 9s, degraded was the same 55.6 MB in 22min 12s.
      # Caching the .debs is what actually removes the exposure; the retry
      # inside the action bounds the cost of a cold cache on a bad day.
      - name: Cache apt archives
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-jammy-base-${{ hashFiles('.github/actions/linux-build-deps/action.yml') }}
          restore-keys: apt-jammy-base-

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/linux-build-deps
        # A backstop only: the action's own per-attempt timeouts should fire
        # long before this does.
        timeout-minutes: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # The first automated check that ever launches the packaged app.
  #
  # Everything above this job tests source. The desktop binary has only ever
  # been verified by a human walking it, once, on macOS - and that walk marked
  # 12 of its 17 items UNSEEN and reported two defects that were later traced
  # to the walk harness rather than the app. Linux and Windows ship installers
  # nobody has launched.
  #
  # Both platforms drive through a WebDriver server compiled *into* the app,
  # behind `src-tauri`'s `wdio` feature. That replaced an external
  # `tauri-driver`, which worked on Linux and is a dead end on Windows: with
  # the exactly matching msedgedriver in place, `POST /session` still waited
  # sixty seconds for a Chromium DevTools port that a Tauri WebView2 window
  # never opens.
  #
  # The same server is the only route to macOS, which has no external driver
  # available at all — so that platform is now a matrix entry rather than a
  # research problem.
  #
  # Not in branch protection's required checks on purpose, for now. A harness
  # whose own flakiness is unmeasured should not be able to block a merge
  # until it has a track record; promoting it is a deliberate later step.
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 60 rather than 45: a cold Rust cache on Windows is the slowest build in
    # this workflow, and a timeout there would read as a harness failure.
    timeout-minutes: 60
    strategy:
      # Windows is the operator's own platform and the one whose installer has
      # never been launched by anyone; Linux is where this started because it
      # needs no Rust change. Neither result may hide the other, so no
      # fail-fast — a Windows-only defect is exactly what this matrix is for.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Its own key rather than the `rust` job's: this installs a different
      # package set, and sharing a key would make the two jobs evict each
      # other's archives on every run.
      - name: Cache apt archives
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-jammy-e2e-${{ hashFiles('.github/actions/linux-build-deps/action.yml') }}
          restore-keys: apt-jammy-e2e-

      # Linux only. `xvfb` is needed regardless — a GTK window still has to
      # draw somewhere, and a runner has no display.
      #
      # `webkit2gtk-driver` should now be dead weight: the embedded provider
      # replaces WebKitWebDriver, which is the only thing that package was
      # for. It is kept for this change anyway, so that if the run goes red
      # the cause is unambiguously the provider swap and not a dependency
      # removed in the same breath. Drop it once this is green.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps
        with:
          extra-packages: webkit2gtk-driver xvfb
        timeout-minutes: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No driver to install. The WebDriver server is compiled into the app by
      # the `wdio` feature below, which is the whole point of the embedded
      # provider: `tauri-driver`, WebKitWebDriver and msedgedriver all stop
      # being part of this.
      - name: Install root dependencies
        run: npm ci

      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci

      # `--debug` because a release build costs several minutes more for a
      # binary that behaves the same under WebDriver, and `--no-bundle`
      # because the installer is not what is being driven - the binary is.
      # `bash` on both platforms: PowerShell is the Windows default and has
      # its own reading of the `--` separator, which is the one token that
      # has to survive intact for the flags to reach `tauri` rather than npm.
      # `--features wdio` is what compiles the embedded WebDriver server in.
      # It is off by default and named nowhere else, so a release build cannot
      # pick it up by accident; `lib.rs` additionally requires
      # `debug_assertions`, which `--debug` satisfies here and a release never
      # would.
      - name: Build the app
        shell: bash
        run: npm run tauri build -- --debug --no-bundle --features wdio

      # One step with the branch visible rather than two `if`-guarded steps
      # that would both be called "Drive it". `bash` is forced because Windows
      # runners default to PowerShell and the difference here is one word.
      - name: Drive it
        working-directory: e2e
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # A GTK window with no display server never draws, and never
            # answers the driver either.
            xvfb-run -a npm test
          else
            npm test
          fi

      # The point of the whole exercise is an artefact to look at afterwards,
      # so keep whatever the run produced even when - especially when - it
      # failed.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per matrix entry: v4 refuses a name another job already uploaded,
          # so a shared one would fail the second platform to finish.
          name: e2e-logs-${{ matrix.os }}
          path: |
            e2e/logs/
            e2e/*.log
          if-no-files-found: ignore
