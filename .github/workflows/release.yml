name: Release

on:
  push:
    tags: ['v*']

# The release job uploads assets to the tag's release.
permissions:
  contents: write

jobs:
  # A tag is a promise. Check it before spending twenty minutes on binaries
  # nobody should download.
  gate:
    name: gate
    runs-on: ubuntu-22.04
    # The release body, read out of CHANGELOG.md once and handed to all four
    # build jobs. Computed here rather than in each of them because this is
    # the job that already refuses a tag it does not believe in.
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The bundler names assets from tauri.conf.json, not from the tag, so a
      # tag that disagrees with it ships files labelled with the wrong
      # release and nothing complains. Checked before anything expensive
      # runs, and it also holds the three version files to each other.
      - name: Check the tag matches the configured version
        id: version
        run: |
          set -eu
          configured=$(node -p "require('./src-tauri/tauri.conf.json').version")
          package=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)

          if [ "$package" != "$configured" ] || [ "$cargo" != "$configured" ]; then
            echo "Version files disagree:"
            echo "  src-tauri/tauri.conf.json $configured"
            echo "  package.json              $package"
            echo "  src-tauri/Cargo.toml      $cargo"
            exit 1
          fi

          # A prerelease suffix is fine: v0.3.0-rc1 against version 0.3.0.
          tag=${GITHUB_REF_NAME#v}
          case "$tag" in
            "$configured" | "$configured"-*) ;;
            *)
              echo "Tag $GITHUB_REF_NAME does not match the configured version $configured."
              echo "Bump package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml, then retag."
              exit 1
              ;;
          esac

          echo "Tag $GITHUB_REF_NAME matches version $configured."

          # The version, not the tag: a v0.3.0-rc1 build takes 0.3.0's notes,
          # which is the same rule the case statement above just applied.
          echo "version=$configured" >> "$GITHUB_OUTPUT"

      # Every release from v0.1.0 to v0.10.0 shipped the same hardcoded Install
      # blurb and nothing else, so no release page has ever said what changed
      # in it. The changelog always did. This is the join, and it is a gate
      # step because a tag whose changelog was forgotten should cost seconds
      # rather than twenty minutes of binaries.
      - name: Read the release notes out of CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          notes=$(node scripts/release-notes.mjs "$VERSION")

          # Printed as well as captured: when a release page reads oddly, the
          # first question is what the workflow actually sent.
          echo "Release notes for $VERSION:"
          echo "$notes"

          # A heredoc delimiter, and one carrying the run id, because the notes
          # are many lines of arbitrary markdown — the plain NAME=value form
          # truncates at the first newline, and a fixed delimiter is a line the
          # changelog could in principle contain.
          delimiter="NOX_RELEASE_NOTES_${GITHUB_RUN_ID}"
          {
            echo "body<<$delimiter"
            echo "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    name: ${{ matrix.label }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not deny the others a binary — a partial
      # release beats no release, and the draft shows exactly what's missing.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # 22.04 rather than the latest Ubuntu on purpose: a binary linked
          # against an older glibc runs on newer distributions, not the other
          # way round.
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          # Produces the NSIS installer — `nsis` has been in bundle.targets
          # since before there was a runner to build it. Unsigned, so
          # SmartScreen warns; the release notes say so rather than letting
          # people discover it.
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    env:
      # Present only after the operator's key ceremony (spec §8 of the
      # auto-updater design). Absent, the step below builds without updater
      # artifacts and without latest.json — a working release, not a failed
      # one. The values are never echoed; tauri reads them from the
      # environment directly.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # macOS code signing and notarization is deliberately NOT declared here.
      #
      # A job-level `env:` key whose secret is unset is still *defined*, with
      # an empty value — and `tauri-action` branches on `APPLE_CERTIFICATE`
      # being defined, not on it being non-empty. Declaring these six
      # unconditionally therefore put every macOS build into signing mode
      # whether a certificate existed or not, and the bundler ran
      # `security import` against an empty string:
      #
      #     security: SecKeychainItemImport: One or more parameters passed to
      #     a function were not valid.
      #     failed to bundle project: failed codesign application
      #
      # Both macOS jobs died that way on v0.8.3-uipass (2026-08-23) — the
      # first release build after the signing work landed — while the guard
      # step below had already printed "No Apple certificate" correctly. No
      # APPLE_* secret exists in the repository at all. v0.8.3 was tagged the
      # day before that commit, which is why nothing caught it.
      #
      # The guard exports them to `$GITHUB_ENV` instead, and only once a
      # certificate is really there. A key that is never written stays
      # undefined rather than empty, which is the distinction the bug turned
      # on. See `docs/superpowers/specs/2026-08-22-apple-signing-design.md`.

    steps:
      - uses: actions/checkout@v7

      # The Azure apt mirror behind these runners intermittently degrades in a
      # way apt cannot detect: every request still succeeds, but each one takes
      # 5-18s to start regardless of size, and ~130 packages fetched serially
      # turn a 40-second step into a 10-26 minute one. Nothing errors, so apt's
      # own retry and timeout options never fire. Measured 2026-08-18: healthy
      # was 55.6 MB in 9s, degraded was the same 55.6 MB in 22min 12s.
      # Caching the .debs is what actually removes the exposure; the retry
      # inside the action bounds the cost of a cold cache on a bad day.
      - name: Cache apt archives
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-jammy-patchelf-${{ hashFiles('.github/actions/linux-build-deps/action.yml') }}
          restore-keys: apt-jammy-patchelf-

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/linux-build-deps
        with:
          extra-packages: patchelf
        # A backstop only: the action's own per-attempt timeouts should fire
        # long before this does.
        timeout-minutes: 20

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Updater artifacts are opt-in per build. createUpdaterArtifacts lives
      # in updater.conf.json rather than tauri.conf.json because with it set,
      # `tauri build` *fails* when the private key is absent — and a
      # contributor's local build, and this workflow before the key ceremony,
      # must keep producing installers.
      - name: Decide whether this build signs updates
        id: updater
        shell: bash
        run: |
          set -eu
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
            if [ -z "$pubkey" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY is set, but plugins.updater.pubkey is empty."
              echo "Half a keypair signs updates that nothing can verify. Paste the public"
              echo "key from the key ceremony into src-tauri/tauri.conf.json and retag."
              exit 1
            fi
            echo "args=--config src-tauri/updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "Signing key present: updater artifacts will be built and signed."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "No signing key: installers only, no updater artifacts."
          fi

      # The same shape as the updater guard above, for the same reason: a
      # half-present configuration is worse than an absent one, because it
      # looks like it worked.
      #
      # Signing without notarizing is the trap. Gatekeeper still stops the app
      # — a milder dialog than "damaged", but still a click-through — so the
      # release notes' promise would be wrong and nothing would say so. Apple
      # requires notarization for a Developer ID Application certificate, and
      # this refuses to ship the half that does not.
      #
      # Only names are echoed, never values; the runner masks secrets anyway.
      - name: Check the Apple signing configuration is whole
        if: runner.os == 'macOS'
        shell: bash
        # Scoped to this step, not the job, so the build step below sees only
        # what this one decides to export. See the note on the job's `env:`.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Apple certificate: this build is ad-hoc signed, as every build is today."
            echo "A fresh download will need 'xattr -dr com.apple.quarantine' to open."
            exit 0
          fi

          missing=''
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "APPLE_CERTIFICATE is set, but these repository secrets are missing:"
            echo "  $missing"
            echo
            echo "Signing without notarizing still stops at Gatekeeper, so this would ship"
            echo "an installer whose release notes promise otherwise. Add the missing"
            echo "secrets and retag, or clear APPLE_CERTIFICATE to build ad-hoc as before."
            echo
            echo "See docs/superpowers/specs/2026-08-22-apple-signing-design.md."
            exit 1
          fi

          # Only now, with all six present, do they reach the build step. A
          # heredoc delimiter rather than `NAME=value` because a certificate is
          # multi-line base64 and the plain form silently truncates at the
          # first newline.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            {
              echo "$name<<__APPLE_EOF__"
              echo "${!name}"
              echo "__APPLE_EOF__"
            } >> "$GITHUB_ENV"
          done

          echo "Apple signing configured: this macOS build will be signed and notarized."

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nox ${{ github.ref_name }}
          # Left as a draft deliberately: publishing is a person's decision,
          # not a workflow's. What the draft arrives with is now the changelog
          # section for this version — read and validated by the gate — above
          # the Install text below, so the page explains itself before anyone
          # touches it.
          #
          # The file names below must match `bundle.targets` in
          # src-tauri/tauri.conf.json — today `app`, `dmg`, `deb`, `rpm`,
          # `nsis`. Offering a download that is not in that list sends people
          # looking for a file the build never produced, and nothing here
          # fails when they disagree: these are a string, not a manifest.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
          releaseBody: |
            ${{ needs.gate.outputs.notes }}

            ---

            ## Install

            **macOS** — download the `.dmg` for your chip (`aarch64` is Apple
            Silicon, `x64` is Intel), drag Nox to Applications, then run this
            once:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Nox.app
            ```

            **You will need that command on a fresh download.** The app is
            ad-hoc signed rather than signed with an Apple Developer ID, so
            macOS quarantines it and refuses to open it with *"Nox is damaged
            and can't be opened"* — which sounds like a corrupt download but
            isn't. The command removes the quarantine flag. If you'd rather
            not run it, build from source instead; `npm run app` does the same
            thing from code you can read.

            **You only need it once.** Updates installed from inside Nox —
            *Check for Updates…*, or the toast shortly after launch — are
            verified against the app's own signing key and replace the app in
            place, so they never re-quarantine it. Only the first install
            costs you the command.

            **Linux** — take the `.deb` or the `.rpm`. Built on Ubuntu 22.04,
            so it needs glibc 2.35 or newer. There is no AppImage.

            **Windows** — take the `-setup.exe`. It is ad-hoc built rather
            than signed with a code-signing certificate, so SmartScreen shows
            *"Windows protected your PC"* on first run: choose **More info**,
            then **Run anyway**. Same trade as macOS above — a certificate
            costs money annually, and building from source avoids both.
