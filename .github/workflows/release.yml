name: Release

on:
  push:
    tags: ['v*']

# The release job uploads assets to the tag's release.
permissions:
  contents: write

jobs:
  # A tag is a promise. Check it before spending twenty minutes on binaries
  # nobody should download.
  gate:
    name: gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The bundler names assets from tauri.conf.json, not from the tag, so a
      # tag that disagrees with it ships files labelled with the wrong
      # release and nothing complains. Checked before anything expensive
      # runs, and it also holds the three version files to each other.
      - name: Check the tag matches the configured version
        run: |
          set -eu
          configured=$(node -p "require('./src-tauri/tauri.conf.json').version")
          package=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)

          if [ "$package" != "$configured" ] || [ "$cargo" != "$configured" ]; then
            echo "Version files disagree:"
            echo "  src-tauri/tauri.conf.json $configured"
            echo "  package.json              $package"
            echo "  src-tauri/Cargo.toml      $cargo"
            exit 1
          fi

          # A prerelease suffix is fine: v0.3.0-rc1 against version 0.3.0.
          tag=${GITHUB_REF_NAME#v}
          case "$tag" in
            "$configured" | "$configured"-*) ;;
            *)
              echo "Tag $GITHUB_REF_NAME does not match the configured version $configured."
              echo "Bump package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml, then retag."
              exit 1
              ;;
          esac

          echo "Tag $GITHUB_REF_NAME matches version $configured."

      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    name: ${{ matrix.label }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not deny the others a binary — a partial
      # release beats no release, and the draft shows exactly what's missing.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # 22.04 rather than the latest Ubuntu on purpose: a binary linked
          # against an older glibc runs on newer distributions, not the other
          # way round.
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nox ${{ github.ref_name }}
          # Left as a draft deliberately: the notes below are the minimum a
          # download needs to work, not the release notes. Write those, then
          # publish by hand.
          #
          # The file names below must match `bundle.targets` in
          # src-tauri/tauri.conf.json — today `app`, `dmg`, `deb`, `rpm`,
          # `nsis`. Offering a download that is not in that list sends people
          # looking for a file the build never produced, and nothing here
          # fails when they disagree: these are a string, not a manifest.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## Install

            **macOS** — download the `.dmg` for your chip (`aarch64` is Apple
            Silicon, `x64` is Intel), drag Nox to Applications, then run this
            once:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Nox.app
            ```

            **You will need that command.** The app is ad-hoc signed rather
            than signed with an Apple Developer ID, so macOS quarantines it on
            download and refuses to open it with *"Nox is damaged and can't be
            opened"* — which sounds like a corrupt download but isn't. The
            command removes the quarantine flag. If you'd rather not run it,
            build from source instead; `npm run app` does the same thing from
            code you can read.

            **Linux** — take the `.deb` or the `.rpm`. Built on Ubuntu 22.04,
            so it needs glibc 2.35 or newer. There is no AppImage.

            **Windows** — build from source for now.
