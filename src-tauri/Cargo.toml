[package]
name = "nox"
version = "0.8.0"
description = "Nox — a fast, dark, keyboard-first text editor"
edition = "2021"
rust-version = "1.77"
default-run = "nox"

[lib]
name = "nox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Legacy text encodings, both directions. The WHATWG Encoding Standard
# implementation Firefox and ripgrep use. It has to be here rather than in the
# renderer because the webview's `TextEncoder` is UTF-8 only — a JS decoder
# could open a windows-1252 file and then be structurally unable to save it
# back as one.
encoding_rs = "0.8"
tauri-plugin-dialog = "2"
# Self-update: checks the signed latest.json on the newest published GitHub
# release and swaps the binary. All network traffic and all signature
# verification live in this plugin — the renderer only ever sees the result.
tauri-plugin-updater = "2"
# One call: relaunch after an install. The capability grants restart only.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Raw notify rather than a debouncer crate: coalescing lives in the renderer
# where it can be tested. See src/watcher.rs.
notify = "8"
# Deleting from the explorer moves to the OS trash rather than unlinking.
# A text editor should never make a file unrecoverable with one click.
trash = "5"
# Project search. `ignore` is ripgrep's walker: parallel, and it honours
# .gitignore, which is the difference between searching a project and
# searching a build directory.
ignore = "0.4"
regex = "1"
# A real pty rather than piped stdio. Pipes are not a terminal: programs see
# a non-tty and turn off colour, line editing and interactivity, so vim, less
# and even a shell prompt do not work. WezTerm's crate, for the platform
# differences — a Windows pty is ConPTY, not a file descriptor.
portable-pty = "0.9"
# Streaming HTTP for local model servers. No TLS features: this client only
# ever talks to loopback over plain HTTP, and pulling in native-tls or rustls
# for a connection to 127.0.0.1 would be a large dependency bought for nothing.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
# Used by name for the oneshot cancel channel and `select!`. Tauri depends on
# tokio, but a transitive dependency is not in scope for `tokio::` paths.
tokio = { version = "1", features = ["sync", "macros"] }

[profile.release]
# The binary is the product; optimise it like one.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
